<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amo1 • Device B</title><link rel="stylesheet" href="styles.css"></head><body class="b">
<main><header><div class="brand"><b>✦</b><span><strong>Amo1</strong><small>Device B · Camera</small></span></div><button class="dark" id="stop">Stop</button></header>
<section class="cameraGrid"><button class="arrow" id="prev">‹<small>back</small></button><div class="cameraWrap"><div id="cameraStage" class="cameraStage">
<video id="cameraVideo" autoplay playsinline muted></video><div class="tint"></div><div id="stickers" class="stickers"></div>
<div class="topStatus"><span id="status">Connecting…</span><span id="fps">2f/s capture: off</span></div>
<div id="overlay" class="overlay"><div><div class="orb">◉</div><h1>Connect this camera</h1><p>Tap Camera and approve the browser camera permission.</p></div></div>
<div class="controls"><button id="flip">↻<small>Flip</small></button><button id="camera" class="shutter"><i></i><small>Camera</small></button><button id="photo">●<small>Photo</small></button></div></div></div><button class="arrow" id="next">›<small>next</small></button></section>
<section class="tools"><div class="tool"><small>STICKERS</small><h2 id="cat">Anime</h2><div><button class="chip active" data-cat="anime">Anime</button><button class="chip" data-cat="nature">Nature</button><button class="chip" data-cat="background">Background</button></div><div id="list" class="list"></div></div><div class="tool"><small>MOOD ASSIST</small><h2 id="mood">Camera off</h2><p id="moodText">Start the camera to enable the local assist.</p></div><div class="tool time"><small>TIME</small><h2 id="time">—</h2><p id="date">—</p></div></section>
<footer>Camera and location sharing require your approval.</footer></main>
<script src="config.js"></script><script src="common.js"></script><script src="camera.js"></script></body></html>
